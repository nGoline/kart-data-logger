[platformio]
; Default display build: the Arduino_GFX backend (lib/DisplayGFX). The esp_lcd
; backend remains available as `-e display` (fallback).
default_envs = display_gfx

[env]
framework = arduino
monitor_speed = 115200
build_flags =
	-Ofast
	-Wall
    ; INFO, deliberately not DEBUG. The Arduino core gates its boot banner on
    ; `#if ARDUHAL_LOG_LEVEL >= ARDUHAL_LOG_LEVEL_DEBUG` (cores/esp32/main.cpp),
    ; and printBeforeSetupInfo() runs BEFORE setup() — so those few hundred lines
    ; of chip/partition/GPIO dump are written while CDC still has its default
    ; blocking TX timeout, our Serial.setTxTimeoutMs(0) being inside setup().
    ; With USB enumerated but nothing draining the port, every one of those
    ; writes blocks, and the dash sits with a dark screen for ~5 minutes until
    ; they time out. Attaching a serial monitor drains the buffer and it starts
    ; instantly — which is exactly the symptom. INFO drops the banner entirely
    ; and keeps log_i/log_w/log_e; only 14 log_d() calls are affected, and the
    ; LapManager ones are already behind setVerbose().
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -I lib/shared

; ── Shared display hardware settings ─────────────────────────────────────────
; The display board is the only node in the system: GPS is wired straight to it
; (RX=6 / TX=7) and all acquisition, lap timing and SD logging happen here.
[display_common]
platform     = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board        = JC3248W535N
upload_port  = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_src_filter = +<main_display.cpp>
lib_deps_base =
    lvgl/lvgl @ ^9.5.0
    electroniccats/MPU6050@^1.3.1
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.5.1
build_flags_base =
    -D IS_DISPLAY
    -D GPS_PROVIDER_ATGM336
    -D GPS_STANDALONE_RX=6
    -D GPS_STANDALONE_TX=7
    ; GoPro BLE remote (lib/GoProManager). Recording follows the log session.
    ; Set GOPRO_NAME_FILTER to a fragment of the camera name (the 4 digits from
    ; "GoPro 1234") to pin the dash to one camera in a busy paddock.
    -D ENABLE_GOPRO
    -D GOPRO_NAME_FILTER='"6421"'
    ; Preset loaded on every connect, so a session never inherits whatever mode
    ; the camera was last left in (a race once came back as a timelapse).
    ; 9 = the "Motor" preset on this HERO8: 2.7K / 60fps / SuperView.
    ;
    ; The ID is per-camera, not a GoPro-wide constant. To find it on another
    ; body, run tools/gopro/gopro_presets.py and read the preset whose title_id
    ; is 23 (EnumPresetTitle MOTOR); user-defined presets report user_defined=1.
    -D GOPRO_PRESET_ID=9
    ; NimBLE defaults its own log level to CORE_DEBUG_LEVEL.
    ; That prints a line per advertisement via console_printf (bypassing the
    ; ARDUHAL filter) and, with Serial.setTxTimeoutMs(0) dropping bytes when the
    ; CDC buffer fills, shreds the serial log. 2 = warnings + errors only.
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2
    ; lv_font_conv output (lib/DashFonts) includes <lvgl/lvgl.h> unless told
    ; otherwise; PlatformIO puts lvgl.h on the include path directly.
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; On-demand WiFi portal (lib/WebPortal) — the enclosure is sealed and the SD
    ; card is not reachable, so this is how logs come off and config goes on.
    ; Off at boot; started from the config screen. A SoftAP draws ~100 mA, so it
    ; is never left running by accident — the status bar shows it while live.
    -D ENABLE_WEB_PORTAL
    ; -D WEB_PORTAL_SSID='"kart-dash"'
    ; -D WEB_PORTAL_PASS='"kartdash"'
    ; -D ENABLE_IMU # MPU6050 on I2C SDA=18 / SCL=17 (free now that GPS moved to 6/7).
    -I include/display

; Display (esp_lcd / DisplayBSP backend) — fallback panel driver.
[env:display]
extends = env
platform         = ${display_common.platform}
board            = ${display_common.board}
upload_port      = ${display_common.upload_port}
monitor_port     = ${display_common.monitor_port}
build_src_filter = ${display_common.build_src_filter}
lib_deps         = ${display_common.lib_deps_base}
build_flags =
    ${env.build_flags}
    ${display_common.build_flags_base}
    -D LV_CONF_PATH=\"${platformio.include_dir}/display/lv_conf.h\"
extra_scripts = pre:fix_stride.py

; Display (Arduino_GFX backend) — full-frame Arduino_Canvas single-blit path.
; NOTE: LV_LVGL_H_INCLUDE_SIMPLE is required by the lv_font_conv output in
; lib/DashFonts — without it those files reach for <lvgl/lvgl.h>.
[env:display_gfx]
extends = env
platform         = ${display_common.platform}
board            = ${display_common.board}
upload_port      = ${display_common.upload_port}
monitor_port     = ${display_common.monitor_port}
build_src_filter = ${display_common.build_src_filter}
lib_deps =
    ${display_common.lib_deps_base}
    moononournation/GFX Library for Arduino@^1.5.0
lib_ignore = DisplayBSP
build_flags =
    ${env.build_flags}
    ${display_common.build_flags_base}
    -D LV_CONF_PATH=\"${platformio.include_dir}/display/lv_conf.h\"
extra_scripts = pre:fix_stride.py
